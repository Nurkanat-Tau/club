name: Unpack project
on:
  push:
    paths:
      - "club-mvp.zip"
      - ".github/workflows/unpack.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip into the repository
        run: |
          if [ ! -f club-mvp.zip ]; then echo "nothing to unpack"; exit 0; fi
          unzip -q -o club-mvp.zip -d /tmp/unpacked
          cp -a /tmp/unpacked/club/. .
          git rm -q club-mvp.zip
          git config user.name "Nurkanat"
          git config user.email "274267149+Nurkanat-Tau@users.noreply.github.com"
          git add -A
          git commit -m "Add Club MVP source code"
          git push
