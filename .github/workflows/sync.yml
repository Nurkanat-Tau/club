name: Sync uploaded code
on:
  push:
    paths:
      - "club-mvp.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the code with the uploaded zip
        run: |
          if [ ! -f club-mvp.zip ]; then echo "nothing to unpack"; exit 0; fi
          unzip -q -o club-mvp.zip -d /tmp/unpacked
          rm club-mvp.zip
          rsync -a --delete --exclude .git --exclude .github /tmp/unpacked/club/ ./
          git config user.name "Nurkanat"
          git config user.email "274267149+Nurkanat-Tau@users.noreply.github.com"
          git add -A
          git commit -m "Update Club source code"
          git push
